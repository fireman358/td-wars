<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TD Wars — Tower Defense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-left">
          <span class="brand">TD WARS</span>
          <span class="hud-label">Crédits</span>
          <span id="credits">0</span>
          <span class="hud-label">Vies</span>
          <span id="lives">20</span>
          <span class="hud-label">Vague</span>
          <span id="wave">1</span>
          <span id="sector"></span>
        </div>
        <div class="hud-right">
          <button id="btn-start" class="btn primary">Lancer la vague</button>
          <button id="btn-sector" class="btn">🧪 Secteur</button>
          <button id="btn-speed" class="btn">x1</button>
          <button id="btn-sound" class="btn">🔊</button>
        </div>
      </header>
      <div id="game-wrap">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="build-bar"></div>
        <div id="info-panel"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
