<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TD Wars — Tower Defense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-row">
          <span class="brand">TD WARS</span>
          <div class="hud-stats">
            <span class="stat"><span class="hud-label">Crédits</span><span id="credits" class="stat-val credits">0</span></span>
            <span class="stat"><span class="hud-label">Vies</span><span id="lives" class="stat-val lives">20</span></span>
            <span class="stat" id="shield-stat" style="display:none"><span class="hud-label">Bouclier</span><span id="shield" class="stat-val shield">0</span></span>
            <span class="stat"><span class="hud-label">Vague</span><span id="wave" class="stat-val wave">0/100</span></span>
          </div>
          <span id="sector" class="sector"></span>
          <div class="hud-saber">
            <span class="hud-label">Sabre</span>
            <span id="saber-bar"><span id="saber-fill"></span></span>
          </div>
        </div>
        <div class="hud-row hud-controls">
          <button id="btn-start" class="btn primary">Lancer la vague</button>
          <div class="hud-btn-group">
            <button id="btn-speed" class="btn">x1</button>
            <button id="btn-sound" class="btn">🔊</button>
            <button id="btn-sector" class="btn" style="display:none" title="Mode test">🧪</button>
            <button id="btn-meta" class="btn">⭐ Perks</button>
            <button id="btn-fullscreen" class="btn">⛶</button>
            <button id="btn-help" class="btn">❓</button>
          </div>
        </div>
      </header>
      <div id="game-wrap">
        <div id="play-row">
          <div id="canvas-holder">
            <canvas id="game" width="960" height="540"></canvas>
            <div id="sector-intro-holder"></div>
            <div id="studio-splash">
              <div class="splash-inner">
                <div class="splash-logo"><svg class="splash-star" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l5.2 18.2 10.8-5.2-5.2 10.8L61 32l-18.2 5.2 5.2 10.8-10.8-5.2L32 61l-5.2-18.2-10.8 5.2 5.2-10.8L3 32l18.2-5.2-5.2-10.8 10.8 5.2z" fill="#38bdf8"/><path d="M32 32c-1.6-2-3-3.1-4.8-3.1a4.7 4.7 0 1 0 0 9.4c1.8 0 3.2-1.1 4.8-3.1 1.6 2 3 3.1 4.8 3.1a4.7 4.7 0 1 0 0-9.4c-1.8 0-3.2 1.1-4.8 3.1z" stroke="#0f1115" stroke-width="2.2" fill="none"/></svg>Edukisto</div>
                <div class="splash-sub">présente</div>
              </div>
            </div>
          </div>
          <aside id="side-panel"><div id="info-panel"></div></aside>
        </div>
        <div id="bottom-bar">
          <div id="build-bar"></div>
        </div>
      </div>
    </div>
    <footer id="site-footer">
      <a href="https://edukisto.win" target="_blank" rel="noopener" class="brand-link">
        <svg class="brand-star" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l5.2 18.2 10.8-5.2-5.2 10.8L61 32l-18.2 5.2 5.2 10.8-10.8-5.2L32 61l-5.2-18.2-10.8 5.2 5.2-10.8L3 32l18.2-5.2-5.2-10.8 10.8 5.2z" fill="#38bdf8"/><path d="M32 32c-1.6-2-3-3.1-4.8-3.1a4.7 4.7 0 1 0 0 9.4c1.8 0 3.2-1.1 4.8-3.1 1.6 2 3 3.1 4.8 3.1a4.7 4.7 0 1 0 0-9.4c-1.8 0-3.2 1.1-4.8 3.1z" stroke="#0f1115" stroke-width="2.2" fill="none"/></svg>
        <span>Edukisto</span>
      </a>
      <span class="sep">·</span>
      <span id="credit-name" title="David Demoulin">TD Wars — un jeu original de David Demoulin</span>

    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
